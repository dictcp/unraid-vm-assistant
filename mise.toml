[tools]
php = "8.4"

[tasks.test]
description = "Run unit tests"
run = "php tests/run.php"

[tasks.build]
description = "Build the installable Unraid plugin"
run = "php scripts/build-plugin.php"

[tasks.validate]
description = "Test, build, and lint the complete plugin package"
depends = ["test", "build"]
run = [
  "php -l src/VMCreationAssistant.page",
  "php -l src/VMManagerIntegration.page",
  "php -l src/lib/VMProvisioner.php",
  "php -l src/scripts/create-vm.php",
  "php -l scripts/build-plugin.php",
  "php -l scripts/validate-plugin.php",
  "php scripts/validate-plugin.php",
]
