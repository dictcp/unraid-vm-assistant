name: Update plugin manifest

on:
  push:
    tags:
      - "20*.*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing YYYY.MM.DD.N tag to write into the plugin manifest
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-plugin-manifest
  cancel-in-progress: false

jobs:
  update-plugin-manifest:
    runs-on: ubuntu-latest
    env:
      MANUAL_TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Write release tag to plugin manifest
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${MANUAL_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]]; then
            echo "Invalid plugin version tag: ${TAG}" >&2
            exit 1
          fi

          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
          for source in \
            src/scripts/vm.sh \
            src/VMCreationAssistant.page \
            src/VMManagerIntegration.page \
            src/lib/VMProvisioner.php \
            src/scripts/create-vm.php \
            README.md; do
            git cat-file -e "${TAG}:${source}"
          done

          CURRENT="$(sed -n 's/^[[:space:]]*version="\([^"]*\)".*/\1/p' unraid-vm-assistant-php.plg | head -n 1)"
          if mise exec -- php -r 'exit(version_compare($argv[1], $argv[2], ">") ? 0 : 1);' "${CURRENT}" "${TAG}"; then
            echo "Manifest version ${CURRENT} is newer than ${TAG}; skipping."
            exit 0
          fi

          mise exec -- php scripts/build-plugin.php "${TAG}"
          mise exec -- php scripts/validate-plugin.php

          if git diff --quiet -- unraid-vm-assistant-php.plg; then
            echo "Plugin manifest already uses ${TAG}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add unraid-vm-assistant-php.plg
          git commit -m "chore: update plugin manifest to ${TAG}"
          git push origin HEAD:main
